<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <style>
    html, body {
        height: 100%;
        margin: 0;
        background-color: #f8f9fa;
    }

    body {
        overflow: hidden;
    }

    .calendar-wrapper {
        height: 100vh;
        padding: 8px;
    }

    #calendar {
        height: 100%;
        background: white;
        border-radius: 12px;
        box-shadow: 0 .3rem 1rem rgba(0,0,0,.12);
        padding: 6px;
    }

    /* Mobile optimization */
    @media (max-width: 768px) {
        .calendar-wrapper {
            padding: 4px;
        }

        #calendar {
            font-size: 12px;
            padding: 2px;
        }

        .fc .fc-toolbar {
            flex-direction: column;
            gap: 5px;
        }

        .fc .fc-toolbar-title {
            font-size: 16px;
        }

        .fc .fc-button {
            padding: 3px 6px;
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<div class="container-fluid calendar-wrapper">
    <div class="row h-100">
        <div class="col-12 h-100">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- <div id="details"
     style="white-space: pre-wrap;

</div> -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const calendarEl = document.getElementById('calendar');

//     const calendar = new FullCalendar.Calendar(calendarEl, {

//         initialView: window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth',

//         height: '100%',
//         expandRows: true,
//         handleWindowResize: true,

//         headerToolbar: {
//             left: 'prev,next today',
//             center: 'title',
//             right: 'dayGridMonth,timeGridWeek,timeGridDay'
//         },

//         events: 'https://script.google.com/macros/s/AKfycbzQ_GrjmANTVlCtxqmDAF0IahW1z9AywD7YTHIaFy-2tC9J7fLvf7cwwI8pZhu963Sf/exec',

//         eventClick: function(details) {
//     alert(
//         "Event: " + details.event.title +
//         "\nPhotographer: " + (details.event.extendedProps.photographer || "") +
//         "\nDescription: " + (details.event.extendedProps.description || "")
//     );
// }
//     }); 
      const calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth',

    height: '100%',
    expandRows: true,
    handleWindowResize: true,

    headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },

    events: 'https://script.google.com/macros/s/AKfycbzQ_GrjmANTVlCtxqmDAF0IahW1z9AywD7YTHIaFy-2tC9J7fLvf7cwwI8pZhu963Sf/exec',

    // ⭐ THIS IS THE MAIN CHANGE
    eventContent: function(arg) {
        return {
            html: `
                <div style="
                    font-weight:600;
                    font-size:12px;
                    line-height:1.2;
                ">
                    📸 ${arg.event.extendedProps.photographer || 'Unknown'}
                </div>
                <div style="
                    font-size:10px;
                    opacity:0.75;
                ">
                    ${arg.event.title}
                </div>
            `
        };
    },

    eventClick: function(details) {
        const p = details.event.extendedProps;

        alert(
            "Event: " + details.event.title +
            "\nPhotographer: " + (p.photographer || "N/A") +
            "\nDescription: " + (p.description || "N/A")
        );
    }
});

    //  THIS WAS MISSING (IMPORTANT)
    calendar.render();

    // optional: auto refresh view when rotate/resize
    window.addEventListener('resize', function () {
        const newView = window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth';
        calendar.changeView(newView);
    });
    //happy 

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
